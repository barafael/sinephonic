# Static hosting for the Chord Anatomy web bundle.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Browsers only stream-compile WebAssembly served as application/wasm.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Filenames are not content-hashed, so everything is revalidated (cheap 304s).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
