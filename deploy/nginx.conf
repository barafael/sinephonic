# Static hosting for the Chord Anatomy web bundle.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Filenames under /assets carry a content hash, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Browsers only stream-compile WebAssembly served as application/wasm.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page itself must always be revalidated so new deploys are picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
